# Render Blueprint for StarBuild (https://render.com/docs/blueprint-spec)
services:
  - type: web
    name: starbuild
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60
    healthCheckPath: /accounts/login/
    disk:
      name: starbuild-files
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: taajpalm.com,www.taajpalm.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://taajpalm.com,https://www.taajpalm.com
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: DATABASE_URL
        fromDatabase:
          name: starbuild-db
          property: connectionString

databases:
  - name: starbuild-db
    plan: basic-256mb
    region: frankfurt